site_name: Tesseract OCR for Mere Mortals
site_description: Turning pictures of pages into text you can search, copy and keep. Reading a notice, a receipt or a whole folder of scans with a free OCR engine, fixing the pages it struggles with, checking what it got wrong, and knowing where its limits are.
